<!DOCTYPE html> 

<html lang = "en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title id = "title">New Text</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>

    <body>

        <header>

            <div id = "navbar">

                <input type = "text" placeholder = "Unnamed Text" id = "text-title">
                 
                <a href = "https://github.com/akishyan-premaharan" title = "Follow Me on Github!" target = "_blank">

                   <img src = "githublogo.png" alt = "Github logo" title = "Follow Me on Github!" id = "github">

                </a>


                <select id = "save" id = "save-format">

                    <option selected disabled>Save</option>

                    <option value = "txt">.txt (Plain Text)</option>

                    <option value = "rtf">.rtf (Rich Text Format)</option>

                </select>

                <select id = "versions">

                    <option selected disabled>History</option>

                    <option> Not built in yet sorry!</option>


                </select>

            </div>

            <div id = "dropdown1">

                <button id = "Effects" aria-haspopup="true"> Effects</button>

                <div id="effects-menu">

                    <button id = "flip"> Flip </button>

                    <button id = "erase"> Erase All </button>

                    <div id="random-menu">

                    <button id="random"> Random </button>

                    <div id="random-bt-content">

                        <label for="random-length">Length of Random Text</label>

                        <input type="number" id="random-length" id="random-length" min="1" value="1" title = "Choose the randomly generated text's length">

                        <label for="randomness">How Random? (Ex: 100 for 1/100)</label>

                        <input type="number" id="randomness" id="randomness" min="1" value="1" title = "Choose how random the text will be (Ex: 100 for 1 out of 100)">

                        <label for="entropy">Entropy</label>

                        <input type="number" id="entropy" min="0" placeholder = "80 bits" title = "Choose how random the text will be (Ex: 100 for 1 out of 100)">

                        <button id = "run-random" style = "background-color: #1a73e8; cursor: pointer;"> Run </button>

                    </div>

                    </div>

                </div>  

                
            </div>

            <br>
             
            <div id = "dropdown2">

                <p id = "word-count"> 0 Words </p>

            </div>

            <span id="sb">

                <input type="text" id="si" placeholder="Find in text" aria-label="Search text" />

                <span id="s-count">0/0</span>
                <button id="prev-sb" type="button" >ʌ</button>
                <button id="next-sb" type="button" >v</button>
                <button id="close-sb" type="button" >x</button>

            </span>

        </header>

        <main>
           
            <textarea rows="120" cols="100" placeholder = "Insert text..." id = "iotext"></textarea>
       
        </main>
        <footer>

            <div id = "finaltext">
               
                <p> A text editing software programmed by Akishyan Premaharan : ) </p>

            </div>


        </footer>
    </body>

</html>
